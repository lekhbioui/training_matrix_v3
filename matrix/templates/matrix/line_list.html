<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des lignes</title>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-10">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">🏭 Lignes de production</h1>
        <ul class="divide-y divide-gray-100">
            {% for line in lines %}
                <li class="py-3 flex justify-between items-center">
                    <div>
                        <p class="font-semibold text-lg text-gray-800">{{ line.name }}</p>
                        {% if line.team_leader %}
                            <p class="text-sm text-gray-500">Chef d'équipe : {{ line.team_leader.get_full_name }}</p>
                        {% endif %}
                    </div>
                    <a href="{% url 'matrix_by_line' line.id %}" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                        Voir la matrice →
                    </a>
                </li>
            {% empty %}
                <p class="text-gray-500">Aucune ligne enregistrée.</p>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
