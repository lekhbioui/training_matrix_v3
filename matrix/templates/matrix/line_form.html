<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier Ligne : {{ line.name }}</title>

    <!-- Inclure le CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Styles spécifiques pour les champs du formulaire Django (ajustés pour as_p) */
        .form-django p {
            margin-bottom: 1rem; /* Espacement entre chaque champ généré par as_p */
        }
        .form-django label {
            display: block;
            font-weight: 500;
            color: #374151; /* gray-700 */
            margin-bottom: 0.5rem;
            font-size: 0.95rem; /* slightly smaller label */
        }
        .form-django input[type="text"],
        .form-django input[type="email"],
        .form-django input[type="number"],
        .form-django input[type="date"],
        .form-django select,
        .form-django textarea { /* Ajout de textarea si vos formulaires en utilisent */
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #D1D5DB; /* gray-300 */
            border-radius: 0.5rem; /* rounded-lg */
            font-size: 1rem;
            color: #1F2937; /* gray-900 */
            background-color: #F9FAFB; /* gray-50 */
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        .form-django input[type="text"]:focus,
        .form-django input[type="email"]:focus,
        .form-django input[type="number"]:focus,
        .form-django input[type="date"]:focus,
        .form-django select:focus,
        .form-django textarea:focus {
            outline: none;
            border-color: #3B82F6; /* blue-500 */
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); /* blue-500 with opacity */
        }
        .form-django .helptext {
            font-size: 0.875rem; /* text-sm */
            color: #6B7280; /* gray-500 */
            margin-top: 0.25rem;
        }
        .form-django .errorlist {
            color: #EF4444; /* red-500 */
            font-size: 0.875rem; /* text-sm */
            margin-top: 0.5rem;
            list-style: none;
            padding: 0;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 to-emerald-100 flex items-center justify-center py-10 px-4">

<div class="w-full max-w-xl bg-white shadow-2xl rounded-2xl p-8 md:p-10 border border-gray-200">
    
    <!-- En-tête -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-2">🏭 Modifier la Ligne</h1>
        <p class="text-gray-600 text-lg">Éditez les informations de la ligne : <span class="font-semibold text-green-700">{{ line.name }}</span></p>
    </div>

    <!-- Formulaire de modification de ligne -->
    <form method="post" class="space-y-6 form-django">
        {% csrf_token %}

        {% if form.non_field_errors %}
        <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-4 mb-4" role="alert">
            <p class="font-medium">⚠️ Erreur(s) :</p>
            <ul class="list-disc pl-5 mt-2">
                {% for error in form.non_field_errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        {{ form.as_p }}

        <!-- Boutons -->
        <div class="flex flex-col sm:flex-row items-center justify-between pt-6 gap-4">
            <a href="{% url 'rh_manage_tasks_lines' %}" 
               class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-xl text-green-700 bg-green-100 hover:bg-green-200 transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 w-full sm:w-auto">
                <span class="mr-2">⬅️</span> Retour à la gestion
            </a>

            <button type="submit" 
                class="inline-flex items-center justify-center px-8 py-3 border border-transparent text-base font-semibold rounded-xl text-white bg-blue-600 hover:bg-blue-700 shadow-lg transition-all duration-200 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 w-full sm:w-auto">
                <span class="mr-2">💾</span> Enregistrer les modifications
            </button>
        </div>
    </form>
</div>

</body>
</html>
