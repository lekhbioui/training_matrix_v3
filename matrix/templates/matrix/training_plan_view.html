<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Plan de formation
    </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;

            overflow: hidden;
        }

        .plan-image {
            width: 100%;
            height: 100%;

            object-fit: contain;
            object-position: center;
        }
    </style>
</head>

<body>

    <img
        class="plan-image"
        src="{% if plan_image_url %}{{ plan_image_url }}{% else %}{% url 'training_plan_image' approval_request.pk %}{% endif %}"
        alt="Plan de formation"
    >

</body>

</html>
